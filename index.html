<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커스텀 티어리스트 빌더</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Noto+Sans+KR:wght@300;400;700;900&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    /* ============================================================
   CSS CUSTOM PROPERTIES — THEME SYSTEM
   ============================================================ */
    :root {
      --gold: #C9A84C;
      --gold-light: #F0D080;
      --gold-dark: #8A6A1E;
      --orange: #DD6E42;
      --teal: #4F6D7A;
      --teal-light: #6B8E9F;
      --bg: #0A0A0C;
      --bg2: #111116;
      --bg3: #18181F;
      --surface: #1E1E28;
      --surface2: #252535;
      --border: #2E2E40;
      --border-gold: rgba(201, 168, 76, 0.4);
      --text: #F0EDE8;
      --text-muted: #888899;
      --white: #FFFFFF;
      --red: #E85757;
      --font: 'Outfit', 'Noto Sans KR', sans-serif;
      --radius: 8px;
      --radius-lg: 14px;
      --glow-gold: 0 0 12px rgba(201, 168, 76, 0.6), 0 0 30px rgba(201, 168, 76, 0.25);
      --glow-orange: 0 0 10px rgba(221, 110, 66, 0.5), 0 0 25px rgba(221, 110, 66, 0.2);
      --transition: 0.2s ease;
      --label-width: 68px;
    }

    /* ============================================================
   RESET & BASE
   ============================================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    button {
      font-family: var(--font);
      cursor: pointer;
      border: none;
      outline: none;
    }

    input,
    textarea {
      font-family: var(--font);
      outline: none;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg2);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold-dark);
    }

    /* ============================================================
   DRAG-OVER HIGHLIGHT (page-level drop for image upload)
   ============================================================ */
    body.drag-upload-over::after {
      content: '이미지를 여기에 드롭하세요';
      position: fixed;
      inset: 0;
      background: rgba(201, 168, 76, 0.08);
      border: 3px dashed var(--gold);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold);
      z-index: 9999;
      pointer-events: none;
      animation: pulse-border 1s ease-in-out infinite alternate;
    }

    @keyframes pulse-border {
      from {
        border-color: var(--gold);
      }

      to {
        border-color: var(--orange);
      }
    }

    /* ============================================================
   APP LAYOUT
   ============================================================ */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 180px;
      /* space for fixed pool */
      position: relative; /* needed for absolute sticker layer */
    }

    /* ============================================================
   HEADER
   ============================================================ */
    #header {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 18px 28px 14px;
      border-bottom: 1px solid var(--border-gold);
      background: linear-gradient(180deg, rgba(201, 168, 76, 0.06) 0%, transparent 100%);
    }

    #header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--orange), var(--gold), transparent);
      opacity: 0.7;
    }

    .header-side {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    #header-left {
      text-align: left;
    }

    #header-right {
      text-align: right;
    }

    #header-title-wrap {
      text-align: center;
    }

    #header-title {
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 40%, var(--orange) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 10px rgba(201, 168, 76, 0.4));
    }

    #header-subtitle {
      font-size: 0.8rem;
      color: var(--teal-light);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 300;
      margin-top: 2px;
    }

    /* ============================================================
   MAIN TIER BOARD
   ============================================================ */
    #tier-board {
      flex: 1;
      padding: 20px 28px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tier-row {
      display: flex;
      align-items: stretch;
      min-height: 72px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      transition: border-color var(--transition);
      position: relative;
    }

    .tier-row:hover {
      border-color: var(--border-gold);
    }

    .tier-row.drag-over-row .tier-items {
      background: rgba(201, 168, 76, 0.07);
    }

    /* Label cell */
    .tier-label {
      min-width: var(--label-width);
      max-width: var(--label-width);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      cursor: default;
      flex-shrink: 0;
      position: relative;
      border-right: 2px solid var(--border-gold);
      transition: box-shadow var(--transition);
      word-break: break-all;
      border-top-left-radius: var(--radius);
      border-bottom-left-radius: var(--radius);
    }

    .tier-label-resizer {
      position: absolute;
      right: 0;
      top: 0;
      width: 8px;
      height: 100%;
      cursor: ew-resize;
      background: transparent;
      z-index: 10;
    }

    .tier-label-resizer:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Items zone */
    .tier-items {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      min-height: 72px;
      transition: background var(--transition);
      background: var(--bg3);
    }

    /* Row action buttons */
    .row-actions {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      padding: 4px;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      flex-shrink: 0;
      border-top-right-radius: var(--radius);
      border-bottom-right-radius: var(--radius);
    }

    .row-actions button {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }

    .row-actions button:hover {
      background: var(--surface2);
      color: var(--text);
    }

    .row-actions .btn-row-edit:hover {
      color: var(--gold);
    }

    .row-actions .btn-row-up:hover,
    .row-actions .btn-row-down:hover {
      color: var(--teal-light);
    }

    .row-actions .btn-row-delete:hover {
      color: var(--red);
    }

    /* Add row button */
    #add-row-btn-board {
      margin: 8px auto 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 24px;
      border-radius: 20px;
      background: transparent;
      border: 1.5px dashed var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      transition: all var(--transition);
    }

    #add-row-btn-board:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201, 168, 76, 0.06);
    }

    /* ============================================================
   TIER ITEM (image card)
   ============================================================ */
    .tier-item {
      position: relative;
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      cursor: grab;
      border: 2px solid transparent;
      transition: all 0.25s ease;
      background: var(--surface);
    }

    .tier-item:active {
      cursor: grabbing;
    }

    .tier-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      border-radius: 5px;
    }

    .tier-item:hover {
      border-color: var(--gold);
      box-shadow: var(--glow-gold);
      transform: scale(1.08);
      z-index: 10;
    }

    .tier-item .item-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(232, 87, 87, 0.9);
      color: white;
      font-size: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      line-height: 1;
    }

    .tier-item:hover .item-remove {
      display: flex;
    }

    .tier-item.sortable-ghost {
      opacity: 0.35;
      border-color: var(--gold);
    }

    .tier-item.sortable-drag {
      box-shadow: var(--glow-gold);
    }

    /* ============================================================
   CONTROLS BAR
   ============================================================ */
    #controls-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .ctrl-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .ctrl-btn-primary {
      background: linear-gradient(135deg, var(--orange) 0%, #C55A30 100%);
      color: var(--white);
      box-shadow: 0 2px 12px rgba(221, 110, 66, 0.3);
    }

    .ctrl-btn-primary:hover {
      box-shadow: var(--glow-orange), 0 4px 20px rgba(221, 110, 66, 0.4);
      transform: translateY(-1px);
    }

    .ctrl-btn-gold {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: #0A0A0C;
      font-weight: 700;
      box-shadow: 0 2px 12px rgba(201, 168, 76, 0.3);
    }

    .ctrl-btn-gold:hover {
      box-shadow: var(--glow-gold), 0 4px 20px rgba(201, 168, 76, 0.4);
      transform: translateY(-1px);
    }

    .ctrl-btn-ghost {
      background: var(--surface);
      color: var(--text-muted);
      border-color: var(--border);
    }

    .ctrl-btn-ghost:hover {
      background: var(--surface2);
      color: var(--text);
      border-color: var(--border-gold);
    }

    .ctrl-btn-teal {
      background: linear-gradient(135deg, var(--teal) 0%, #3A5260 100%);
      color: var(--white);
    }

    .ctrl-btn-teal:hover {
      box-shadow: 0 0 12px rgba(79, 109, 122, 0.5);
      transform: translateY(-1px);
    }

    #ctrl-spacer {
      flex: 1;
    }

    /* Preview toggle active state */
    .ctrl-btn-preview-active {
      background: linear-gradient(135deg, var(--teal-light) 0%, var(--teal) 100%) !important;
      color: var(--white) !important;
      box-shadow: 0 0 14px rgba(107, 142, 159, 0.5) !important;
    }

    /* ============================================================
   ASSET POOL (fixed bottom)
   ============================================================ */
    #asset-pool {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--bg2);
      border-top: 2px solid var(--border-gold);
      display: flex;
      flex-direction: column;
    }

    #pool-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px 4px;
    }

    #pool-header span {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--gold);
    }

    #pool-count {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--surface);
      padding: 1px 7px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    #pool-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 10px 10px;
    }

    #pool-items {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 74px;
      flex-wrap: nowrap;
      padding: 2px;
    }

    #pool-items .tier-item {
      flex-shrink: 0;
    }

    #pool-empty-msg {
      color: var(--text-muted);
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px;
      pointer-events: none;
    }

    /* ============================================================
   PREVIEW MODE
   ============================================================ */
    body.preview-mode #controls-bar {
      display: none;
    }

    body.preview-mode .row-actions {
      display: none;
    }

    body.preview-mode #asset-pool {
      display: none;
    }

    body.preview-mode #app {
      padding-bottom: 0;
    }

    body.preview-mode .tier-row {
      border-color: var(--border-gold);
    }

    body.preview-mode .tier-item {
      cursor: default;
    }

    body.preview-mode .tier-item:hover {
      transform: scale(1.18);
      box-shadow: var(--glow-gold);
      z-index: 20;
    }

    body.preview-mode .tier-item .item-remove {
      display: none !important;
    }

    body.preview-mode .tier-label {
      filter: drop-shadow(0 0 8px currentColor);
    }

    /* Preview overlay bar */
    #preview-bar {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      gap: 10px;
      align-items: center;
      background: rgba(10, 10, 12, 0.85);
      border: 1px solid var(--border-gold);
      border-radius: 50px;
      padding: 10px 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6), var(--glow-gold);
    }

    body.preview-mode #preview-bar {
      display: flex;
    }

    /* ============================================================
   MODAL OVERLAY
   ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 28px;
      min-width: 360px;
      max-width: 520px;
      width: 90vw;
      box-shadow: 0 8px 60px rgba(0, 0, 0, 0.8), var(--glow-gold);
      transform: scale(0.95) translateY(10px);
      transition: transform 0.2s ease;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.open .modal {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-gold);
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .modal-close {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }

    .modal-close:hover {
      background: var(--red);
      color: white;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .form-group input[type="text"],
    .form-group textarea {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 12px;
      color: var(--text);
      font-size: 0.92rem;
      width: 100%;
      transition: border-color var(--transition);
    }

    .form-group input[type="text"]:focus,
    .form-group textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(201, 168, 76, 0.15);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .form-row .form-group {
      flex: 1;
      margin: 0;
    }

    .color-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-input-wrap input[type="color"] {
      width: 44px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg3);
      cursor: pointer;
      padding: 2px;
    }

    .color-input-wrap input[type="text"] {
      flex: 1;
    }

    .form-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold);
      margin: 20px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-gold);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .toggle-label {
      font-size: 0.88rem;
      color: var(--text);
      flex: 1;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--text-muted);
      top: 3px;
      left: 3px;
      transition: transform 0.2s, background 0.2s;
    }

    .toggle input:checked+.toggle-slider {
      background: var(--gold);
    }

    .toggle input:checked+.toggle-slider::before {
      transform: translateX(20px);
      background: var(--bg);
    }

    .gradient-stops {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .gradient-stops .form-group {
      flex: 1;
      margin: 0;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* ============================================================
   THEME SELECT
   ============================================================ */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 6px;
    }

    .theme-card {
      border-radius: var(--radius);
      border: 2px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }

    .theme-card:hover {
      border-color: var(--gold);
      transform: scale(1.03);
    }

    .theme-card.active {
      border-color: var(--gold);
      box-shadow: var(--glow-gold);
    }

    .theme-card.active::after {
      content: '✓';
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 12px;
      color: var(--gold);
      font-weight: 700;
    }

    .theme-swatch {
      height: 48px;
      display: flex;
    }

    .theme-swatch span {
      flex: 1;
    }

    .theme-name {
      font-size: 0.7rem;
      text-align: center;
      padding: 4px;
      background: var(--surface2);
      color: var(--text-muted);
      font-weight: 600;
    }

    /* ============================================================
   ICON FONT SETUP (unicode emoji fallback — no external icons)
   ============================================================ */
    .icon {
      font-style: normal;
    }

    /* ============================================================
   ANIMATION KEYFRAMES
   ============================================================ */
    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tier-row {
      animation: fadeSlideIn 0.3s ease both;
    }

    .tier-item {
      animation: fadeSlideIn 0.2s ease both;
    }

    /* ============================================================
   SAVING OVERLAY
   ============================================================ */
    #saving-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 9000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    #saving-overlay.show {
      display: flex;
    }

    #saving-overlay span {
      color: var(--gold);
      font-size: 1.1rem;
      font-weight: 600;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ============================================================
   INLINE EDITABLE HEADERS
   ============================================================ */
    [contenteditable] {
      cursor: text;
    }

    [contenteditable]:focus {
      outline: 1px dashed var(--gold);
      border-radius: 4px;
      padding: 2px 4px;
    }

    #header-title[contenteditable]:focus {
      -webkit-text-fill-color: var(--gold-light);
    }

    /* ============================================================
   FREE STICKERS
   ============================================================ */
    #tier-board {
      position: relative;
    }

    /* 스티커 레이어: #app 내부 absolute — 스크롤 따라감, html2canvas 캡처 포함 */
    #sticker-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10000;
    }

    .free-sticker {
      position: absolute;
      font-size: 22px;
      font-weight: 900;
      cursor: move;
      pointer-events: all;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9), 0 0 10px currentColor;
      user-select: none;
      line-height: 1;
      transform: translate(-50%, -50%);
      transition: filter 0.15s;
    }

    .free-sticker:hover {
      filter: brightness(1.3);
    }

    .sticker-up {
      color: #22DD55;
    }

    .sticker-down {
      color: #FF3344;
    }

    body.preview-mode .free-sticker {
      cursor: default;
    }

    .ctrl-btn-sticker-active {
      outline: 2px solid var(--gold) !important;
      box-shadow: var(--glow-gold) !important;
    }

    /* ============================================================
   DOUBLE-CLICK ZOOM
   ============================================================ */
    .tier-item.zoomed {
      transform: scale(3) !important;
      z-index: 500 !important;
      overflow: visible !important;
      border-color: var(--gold) !important;
      box-shadow: var(--glow-gold), 0 0 40px rgba(0, 0, 0, 0.8) !important;
    }

    /* ============================================================
   LABEL WIDTH RESIZER (in row modal)
   ============================================================ */
    #rm-label-width-display {
      font-size: 0.82rem;
      color: var(--teal-light);
      font-weight: 600;
      min-width: 40px;
      text-align: right;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      border: 2px solid var(--bg);
      box-shadow: 0 0 4px rgba(201, 168, 76, 0.5);
    }

    /* ============================================================
   RESPONSIVE
   ============================================================ */
    @media (max-width: 640px) {
      #header {
        grid-template-columns: 1fr;
        text-align: center;
      }

      #header-left,
      #header-right {
        display: none;
      }

      #tier-board {
        padding: 12px;
      }

      #controls-bar {
        padding: 10px 12px;
      }

      .ctrl-btn {
        padding: 8px 12px;
        font-size: 0.78rem;
      }

      .tier-label {
        min-width: 52px;
        max-width: 52px;
        font-size: 1.4rem;
      }
    }
  </style>
</head>

<body>

  <!-- ============================================================
     STRUCTURE
     ============================================================ -->
  <div id="app">

    <!-- HEADER -->
    <header id="header">
      <div class="header-side" id="header-left" contenteditable="true" spellcheck="false">티어리스트 설명</div>
      <div id="header-title-wrap">
        <div id="header-title" contenteditable="true" spellcheck="false">MY TIER LIST</div>
        <div id="header-subtitle" contenteditable="true" spellcheck="false">Custom Tier List Builder</div>
      </div>
      <div class="header-side" id="header-right" contenteditable="true" spellcheck="false" style="text-align:right;">
        Program by. PENSIL
        Tierlist by. PENSIL</div>
    </header>

    <!-- TIER BOARD -->
    <main id="tier-board"></main>

    <!-- CONTROLS BAR -->
    <div id="controls-bar">
      <button class="ctrl-btn ctrl-btn-primary" id="btn-upload" onclick="document.getElementById('file-input').click()">
        <span>📁</span> 이미지 업로드
      </button>
      <input type="file" id="file-input" multiple accept="image/*" style="display:none">
      <input type="file" id="zip-input" accept=".zip" style="display:none">

      <button class="ctrl-btn ctrl-btn-ghost" id="btn-add-row" onclick="addRow()">
        <span>➕</span> 행 추가
      </button>

      <button class="ctrl-btn ctrl-btn-ghost" id="btn-sticker-up" title="▲ 스티커 — 드래그하여 배치 / 더블클릭 삭제"
        style="cursor:grab;">
        <span style="color:#22DD55;font-size:1.1em;">▲</span> 스티커
      </button>
      <button class="ctrl-btn ctrl-btn-ghost" id="btn-sticker-down" title="▼ 스티커 — 드래그하여 배치 / 더블클릭 삭제"
        style="cursor:grab;">
        <span style="color:#FF3344;font-size:1.1em;">▼</span> 스티커
      </button>

      <div id="ctrl-spacer"></div>

      <button class="ctrl-btn ctrl-btn-ghost" id="btn-save-project" onclick="saveProject()">
        <span>🗂️</span> 프로젝트 저장
      </button>
      <button class="ctrl-btn ctrl-btn-ghost" id="btn-load-project" onclick="document.getElementById('project-input').click()">
        <span>📂</span> 프로젝트 불러오기
      </button>
      <input type="file" id="project-input" accept=".tierjson" style="display:none" onchange="loadProject(event)">

      <button class="ctrl-btn ctrl-btn-ghost" id="btn-settings" onclick="openGlobalSettings()">
        <span>⚙️</span> 설정
      </button>

      <button class="ctrl-btn ctrl-btn-ghost" id="btn-export" onclick="exportTierlist()">
        <span>📂</span> 폴더 내보내기
      </button>

      <button class="ctrl-btn ctrl-btn-ghost" id="btn-import" onclick="importTierlist()">
        <span>📂</span> 폴더 불러오기
      </button>

      <button class="ctrl-btn ctrl-btn-teal" id="btn-preview" onclick="togglePreview()">
        <span>👁</span> 미리보기
      </button>

      <button class="ctrl-btn ctrl-btn-gold" id="btn-save" onclick="savePNG()">
        <span>💾</span> PNG 저장
      </button>
    </div>

    <!-- ASSET POOL -->
    <div id="asset-pool">
      <div id="pool-header">
        <span>미배치 아이템</span>
        <span id="pool-count">0</span>
      </div>
      <div id="pool-scroll">
        <div id="pool-items">
          <div id="pool-empty-msg">이미지를 업로드하면 여기에 표시됩니다</div>
        </div>
      </div>
    </div>

    <!-- STICKER LAYER — absolute inside #app, follows scroll & captured by html2canvas -->
    <div id="sticker-layer"></div>
  </div>

  <!-- PREVIEW BAR (shown in preview mode) -->
  <div id="preview-bar">
    <button class="ctrl-btn ctrl-btn-teal" onclick="togglePreview()">✏️ 편집으로 돌아가기</button>
    <button class="ctrl-btn ctrl-btn-gold" onclick="savePNG()">💾 PNG 저장</button>
  </div>

  <!-- ROW SETTINGS MODAL -->
  <div class="modal-overlay" id="row-modal-overlay" onclick="closeRowModal(event)">
    <div class="modal" id="row-modal">
      <div class="modal-header">
        <span class="modal-title">행 설정</span>
        <button class="modal-close" onclick="closeRowModal()">✕</button>
      </div>
      <div class="form-group">
        <label>행 이름 (라벨)</label>
        <input type="text" id="rm-label" placeholder="예: S">
      </div>

      <div class="form-section-title">라벨 색상</div>
      <div class="form-row">
        <div class="form-group">
          <label>글자 색상</label>
          <div class="color-input-wrap">
            <input type="color" id="rm-text-color">
            <input type="text" id="rm-text-color-hex" maxlength="7" placeholder="#FFFFFF">
          </div>
        </div>
        <div class="form-group">
          <label>배경 색상</label>
          <div class="color-input-wrap">
            <input type="color" id="rm-bg-color">
            <input type="text" id="rm-bg-color-hex" maxlength="7" placeholder="#1E1E28">
          </div>
        </div>
      </div>
      <div class="form-section-title">아이템 영역 배경</div>
      <div class="toggle-row">
        <span class="toggle-label">그라데이션 배경 사용</span>
        <label class="toggle">
          <input type="checkbox" id="rm-gradient-toggle" onchange="toggleGradientUI()">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div id="rm-gradient-ui" style="display:none;">
        <div class="gradient-stops">
          <div class="form-group">
            <label>시작 색상</label>
            <div class="color-input-wrap">
              <input type="color" id="rm-grad-start">
              <input type="text" id="rm-grad-start-hex" maxlength="7" placeholder="#1E1E28">
            </div>
          </div>
          <div class="form-group">
            <label>끝 색상</label>
            <div class="color-input-wrap">
              <input type="color" id="rm-grad-end">
              <input type="text" id="rm-grad-end-hex" maxlength="7" placeholder="#252535">
            </div>
          </div>
        </div>
      </div>
      <div id="rm-solid-ui">
        <div class="form-group">
          <label>단색 배경</label>
          <div class="color-input-wrap">
            <input type="color" id="rm-solid-bg">
            <input type="text" id="rm-solid-bg-hex" maxlength="7" placeholder="#18181F">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="ctrl-btn ctrl-btn-ghost" onclick="closeRowModal()">취소</button>
        <button class="ctrl-btn ctrl-btn-gold" onclick="applyRowSettings()">적용</button>
      </div>
    </div>
  </div>

  <!-- GLOBAL SETTINGS MODAL -->
  <div class="modal-overlay" id="global-modal-overlay" onclick="closeGlobalModal(event)">
    <div class="modal" id="global-modal">
      <div class="modal-header">
        <span class="modal-title">전체 설정</span>
        <button class="modal-close" onclick="closeGlobalModal()">✕</button>
      </div>

      <div class="form-section-title">헤더 텍스트</div>
      <div class="form-group">
        <label>티어리스트 제목</label>
        <input type="text" id="gm-title" placeholder="MY TIER LIST">
      </div>
      <div class="form-group">
        <label>부제목</label>
        <input type="text" id="gm-subtitle" placeholder="Custom Tier List Builder">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>좌측 상단 (출처/제작자)</label>
          <textarea id="gm-left" placeholder="출처&#10;제작자"></textarea>
        </div>
        <div class="form-group">
          <label>우측 상단 (설명)</label>
          <textarea id="gm-right" placeholder="부연 설명"></textarea>
        </div>
      </div>

      <div class="form-section-title">색상 설정</div>
      <div class="toggle-row">
        <span class="toggle-label">자연스러운 색 자동 토글 <small style="color:var(--text-muted);font-size:0.75em;"> (배경 색 변경 시 글자
            색 자동 조정)</small></span>
        <label class="toggle">
          <input type="checkbox" id="gm-auto-color">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="form-section-title">테마 설정</div>
      <div class="theme-grid" id="theme-grid"></div>

      <div class="modal-footer">
        <button class="ctrl-btn ctrl-btn-ghost" onclick="closeGlobalModal()">취소</button>
        <button class="ctrl-btn ctrl-btn-gold" onclick="applyGlobalSettings()">적용</button>
      </div>
    </div>
  </div>

  <!-- SAVING OVERLAY -->
  <div id="saving-overlay">
    <div class="spinner"></div>
    <span>티어리스트 저장 중...</span>
  </div>

  <!-- ============================================================
     JAVASCRIPT
     ============================================================ -->
  <script>
    // ============================================================
    // STATE
    // ============================================================
    const state = {
      tiers: [
        { id: 't1', label: 'S', textColor: '#FFE066', bgColor: '#C1272D', rowBg: '#18181F', useGradient: false, gradStart: '#18181F', gradEnd: '#252535', labelWidth: 68 },
        { id: 't2', label: 'A', textColor: '#FF9966', bgColor: '#E8731A', rowBg: '#18181F', useGradient: false, gradStart: '#18181F', gradEnd: '#252535', labelWidth: 68 },
        { id: 't3', label: 'B', textColor: '#FFE066', bgColor: '#C9A84C', rowBg: '#18181F', useGradient: false, gradStart: '#18181F', gradEnd: '#252535', labelWidth: 68 },
        { id: 't4', label: 'C', textColor: '#66FF99', bgColor: '#2E8B57', rowBg: '#18181F', useGradient: false, gradStart: '#18181F', gradEnd: '#252535', labelWidth: 68 },
        { id: 't5', label: 'D', textColor: '#66CCFF', bgColor: '#4F6D7A', rowBg: '#18181F', useGradient: false, gradStart: '#18181F', gradEnd: '#252535', labelWidth: 68 },
      ],
      pool: [],
      nextTierId: 6,
      nextItemId: 1,
      header: { title: 'MY TIER LIST', subtitle: 'Custom Tier List Builder', left: '티어리스트', right: '' },
      theme: 'black-gold',
      isPreview: false,
      autoColor: false,
    };

    // ============================================================
    // THEMES
    // ============================================================
    const THEMES = {
      'black-gold': {
        name: '블랙 & 골드',
        vars: {
          '--gold': '#C9A84C', '--gold-light': '#F0D080', '--gold-dark': '#8A6A1E',
          '--orange': '#DD6E42', '--teal': '#4F6D7A', '--teal-light': '#6B8E9F',
          '--bg': '#0A0A0C', '--bg2': '#111116', '--bg3': '#18181F',
          '--surface': '#1E1E28', '--surface2': '#252535',
          '--border': '#2E2E40', '--border-gold': 'rgba(201,168,76,0.4)',
          '--text': '#F0EDE8', '--text-muted': '#888899',
        },
        swatches: ['#0A0A0C', '#C9A84C', '#DD6E42'],
      },
      'midnight-purple': {
        name: '미드나잇 퍼플',
        vars: {
          '--gold': '#9B59B6', '--gold-light': '#CF9EE0', '--gold-dark': '#6C3483',
          '--orange': '#8E44AD', '--teal': '#2C3E50', '--teal-light': '#3D5166',
          '--bg': '#09070F', '--bg2': '#0F0B1A', '--bg3': '#141022',
          '--surface': '#1A1530', '--surface2': '#201C3C',
          '--border': '#2D295A', '--border-gold': 'rgba(155,89,182,0.4)',
          '--text': '#EDE8F5', '--text-muted': '#888099',
        },
        swatches: ['#09070F', '#9B59B6', '#8E44AD'],
      },
      'neon-cyber': {
        name: '네온 사이버',
        vars: {
          '--gold': '#00FFD1', '--gold-light': '#80FFE8', '--gold-dark': '#00A085',
          '--orange': '#FF2D78', '--teal': '#0D2137', '--teal-light': '#1A4060',
          '--bg': '#060A10', '--bg2': '#090E16', '--bg3': '#0C1420',
          '--surface': '#0F1A2C', '--surface2': '#162038',
          '--border': '#1A2E44', '--border-gold': 'rgba(0,255,209,0.3)',
          '--text': '#E0F7F4', '--text-muted': '#5A8A84',
        },
        swatches: ['#060A10', '#00FFD1', '#FF2D78'],
      },
      'crimson-dark': {
        name: '크림슨 다크',
        vars: {
          '--gold': '#E84040', '--gold-light': '#FF8080', '--gold-dark': '#9B1212',
          '--orange': '#FF6B35', '--teal': '#4A2030', '--teal-light': '#6A3040',
          '--bg': '#0A0608', '--bg2': '#120810', '--bg3': '#180A14',
          '--surface': '#200C18', '--surface2': '#2C1020',
          '--border': '#3A1828', '--border-gold': 'rgba(232,64,64,0.4)',
          '--text': '#F5E8EA', '--text-muted': '#886070',
        },
        swatches: ['#0A0608', '#E84040', '#FF6B35'],
      },
    };

    function applyTheme(themeKey) {
      const theme = THEMES[themeKey];
      if (!theme) return;
      const root = document.documentElement;
      for (const [k, v] of Object.entries(theme.vars)) {
        root.style.setProperty(k, v);
      }
      state.theme = themeKey;
    }

    function buildThemeGrid() {
      const grid = document.getElementById('theme-grid');
      grid.innerHTML = '';
      for (const [key, theme] of Object.entries(THEMES)) {
        const card = document.createElement('div');
        card.className = 'theme-card' + (state.theme === key ? ' active' : '');
        card.dataset.key = key;
        card.onclick = () => { selectThemeCard(key); };
        card.innerHTML = `
      <div class="theme-swatch">${theme.swatches.map(c => `<span style="background:${c}"></span>`).join('')}</div>
      <div class="theme-name">${theme.name}</div>
    `;
        grid.appendChild(card);
      }
    }

    let _selectedTheme = null;
    function selectThemeCard(key) {
      _selectedTheme = key;
      document.querySelectorAll('#theme-grid .theme-card').forEach(c => {
        c.classList.toggle('active', c.dataset.key === key);
      });
    }

    // ============================================================
    // ZONE SAVE/RESTORE — fixes item loss on re-render
    // ============================================================
    function saveZoneItems() {
      const saved = {};
      document.querySelectorAll('.tier-items').forEach(zone => {
        saved[zone.dataset.tierId] = [...zone.querySelectorAll('.tier-item')];
      });
      return saved;
    }
    function restoreZoneItems(saved) {
      for (const [tierId, items] of Object.entries(saved)) {
        const zone = document.querySelector(`.tier-items[data-tier-id="${tierId}"]`);
        if (zone) items.forEach(el => zone.appendChild(el));
      }
    }

    // ============================================================
    // RENDER TIER BOARD
    // ============================================================
    let sortables = {};

    function renderBoard() {
      const board = document.getElementById('tier-board');
      board.innerHTML = '';

      state.tiers.forEach((tier) => {
        const row = document.createElement('div');
        row.className = 'tier-row';
        row.dataset.id = tier.id;
        const w = tier.labelWidth || 68;

        const label = document.createElement('div');
        label.className = 'tier-label';
        // We use span so resizer fits right over text cleanly
        label.innerHTML = `<span>${tier.label}</span>`;
        label.style.cssText = `background:${tier.bgColor};color:${tier.textColor};box-shadow:inset 0 0 20px rgba(0,0,0,0.3),0 0 16px ${tier.bgColor}66;`;

        const resizer = document.createElement('div');
        resizer.className = 'tier-label-resizer';
        resizer.title = "드래그하여 행 너비 조절";
        resizer.addEventListener('mousedown', function (e) {
          e.stopPropagation(); e.preventDefault();
          const startX = e.clientX;
          const startWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--label-width')) || 68;
          const onMove = ev => {
            const newW = Math.max(40, startWidth + (ev.clientX - startX));
            document.documentElement.style.setProperty('--label-width', newW + 'px');
          };
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
        label.appendChild(resizer);

        const itemsZone = document.createElement('div');
        itemsZone.className = 'tier-items';
        itemsZone.dataset.tierId = tier.id;
        itemsZone.style.background = tier.useGradient
          ? `linear-gradient(135deg,${tier.gradStart} 0%,${tier.gradEnd} 100%)`
          : tier.rowBg;

        const actions = document.createElement('div');
        actions.className = 'row-actions';
        actions.innerHTML = `
          <button class="btn-row-edit" title="행 설정" onclick="openRowModal('${tier.id}')">⚙</button>
          <button class="btn-row-up" title="위로" onclick="moveRow('${tier.id}',-1)">▲</button>
          <button class="btn-row-down" title="아래로" onclick="moveRow('${tier.id}',1)">▼</button>
          <button class="btn-row-delete" title="삭제" onclick="deleteRow('${tier.id}')">✕</button>
        `;

        row.appendChild(label);
        row.appendChild(itemsZone);
        row.appendChild(actions);
        board.appendChild(row);

        if (sortables[tier.id]) sortables[tier.id].destroy();
        sortables[tier.id] = new Sortable(itemsZone, {
          group: 'items', animation: 180,
          ghostClass: 'sortable-ghost', dragClass: 'sortable-drag',
          onAdd: () => updatePoolCount(),
          onRemove: () => updatePoolCount(),
          onEnd: () => updatePoolCount(),
        });
      });

      const addBtn = document.createElement('button');
      addBtn.id = 'add-row-btn-board';
      addBtn.innerHTML = '➕ 새 행 추가';
      addBtn.onclick = addRow;
      board.appendChild(addBtn);
    }

    function renderItem(item) {
      const el = document.createElement('div');
      el.className = 'tier-item';
      el.dataset.itemId = item.id;
      el.innerHTML = `
        <img src="${item.src}" alt="${item.name}" draggable="false">
        <div class="item-remove" onclick="removeItem('${item.id}',event)" title="제거">✕</div>
      `;
      // Double-click to zoom / unzoom (both edit & preview mode)
      el.addEventListener('dblclick', function (e) {
        e.stopPropagation();
        this.classList.toggle('zoomed');
        const row = this.closest('.tier-row');
        if (row) {
          row.style.zIndex = this.classList.contains('zoomed') ? '100' : '';
        }
      });
      return el;
    }

    // ============================================================
    // POOL MANAGEMENT
    // ============================================================
    let poolSortable = null;

    function initPool() {
      const pool = document.getElementById('pool-items');
      if (poolSortable) poolSortable.destroy();
      poolSortable = new Sortable(pool, {
        group: 'items',
        animation: 180,
        ghostClass: 'sortable-ghost',
        dragClass: 'sortable-drag',
        onAdd: () => updatePoolCount(),
        onRemove: () => updatePoolCount(),
      });
    }

    function addToPool(src, name) {
      const id = 'item-' + (state.nextItemId++);
      const item = { id, src, name };
      state.pool.push(item);

      const pool = document.getElementById('pool-items');
      const empty = document.getElementById('pool-empty-msg');
      if (empty) empty.style.display = 'none';
      pool.appendChild(renderItem(item));
      updatePoolCount();
    }

    function updatePoolCount() {
      const pool = document.getElementById('pool-items');
      const all = pool.querySelectorAll('.tier-item');
      document.getElementById('pool-count').textContent = all.length;
      const empty = document.getElementById('pool-empty-msg');
      if (empty) empty.style.display = all.length === 0 ? 'flex' : 'none';
    }

    function removeItem(itemId, event) {
      if (event) event.stopPropagation();
      const el = document.querySelector(`.tier-item[data-item-id="${itemId}"]`);
      if (el) el.remove();
      state.pool = state.pool.filter(i => i.id !== itemId);
      updatePoolCount();
    }

    // ============================================================
    // ROW CRUD
    // ============================================================
    const DEFAULT_COLORS = [
      { bgColor: '#C1272D', textColor: '#FFE066' },
      { bgColor: '#E8731A', textColor: '#FFE0CC' },
      { bgColor: '#C9A84C', textColor: '#FFF8E1' },
      { bgColor: '#2E8B57', textColor: '#CCFFDD' },
      { bgColor: '#4F6D7A', textColor: '#CCE8FF' },
      { bgColor: '#7B2FBE', textColor: '#EACCFF' },
      { bgColor: '#1A6B8A', textColor: '#CCEFFF' },
    ];

    function addRow() {
      const saved = saveZoneItems();
      const colorIdx = state.tiers.length % DEFAULT_COLORS.length;
      const colors = DEFAULT_COLORS[colorIdx];
      const tier = {
        id: 't' + (state.nextTierId++),
        label: 'NEW',
        textColor: colors.textColor,
        bgColor: colors.bgColor,
        rowBg: '#18181F',
        useGradient: false,
        gradStart: '#18181F',
        gradEnd: '#252535',
        labelWidth: 68,
      };
      state.tiers.push(tier);
      renderBoard();
      restoreZoneItems(saved);
      updatePoolCount();
    }

    function deleteRow(tierId) {
      const zone = document.querySelector(`.tier-items[data-tier-id="${tierId}"]`);
      const pool = document.getElementById('pool-items');
      const empty = document.getElementById('pool-empty-msg');
      if (empty) empty.style.display = 'none';

      if (zone) {
        const items = zone.querySelectorAll('.tier-item');
        items.forEach(item => pool.appendChild(item));
      }
      state.tiers = state.tiers.filter(t => t.id !== tierId);
      renderBoard();
      updatePoolCount();
    }

    function moveRow(tierId, dir) {
      const idx = state.tiers.findIndex(t => t.id === tierId);
      if (idx < 0) return;
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= state.tiers.length) return;
      const saved = saveZoneItems();
      [state.tiers[idx], state.tiers[newIdx]] = [state.tiers[newIdx], state.tiers[idx]];
      // Swap saved entries so items follow their original rows
      const idA = state.tiers[idx].id, idB = state.tiers[newIdx].id;
      [saved[idA], saved[idB]] = [saved[idB], saved[idA]];
      renderBoard();
      restoreZoneItems(saved);
      updatePoolCount();
    }

    // ============================================================
    // ROW SETTINGS MODAL
    // ============================================================
    let _editingTierId = null;

    function openRowModal(tierId) {
      _editingTierId = tierId;
      const tier = state.tiers.find(t => t.id === tierId);
      if (!tier) return;
      document.getElementById('rm-label').value = tier.label;
      setColorPair('rm-text-color', 'rm-text-color-hex', tier.textColor);
      setColorPair('rm-bg-color', 'rm-bg-color-hex', tier.bgColor);
      document.getElementById('rm-gradient-toggle').checked = tier.useGradient;
      setColorPair('rm-grad-start', 'rm-grad-start-hex', tier.gradStart || '#18181F');
      setColorPair('rm-grad-end', 'rm-grad-end-hex', tier.gradEnd || '#252535');
      setColorPair('rm-solid-bg', 'rm-solid-bg-hex', tier.rowBg || '#18181F');
      toggleGradientUI();
      document.getElementById('row-modal-overlay').classList.add('open');
    }

    function closeRowModal(event) {
      if (event && event.target !== document.getElementById('row-modal-overlay')) return;
      document.getElementById('row-modal-overlay').classList.remove('open');
    }

    function applyRowSettings() {
      const tier = state.tiers.find(t => t.id === _editingTierId);
      if (!tier) return;
      tier.label = document.getElementById('rm-label').value.trim() || tier.label;
      tier.textColor = document.getElementById('rm-text-color-hex').value;
      tier.bgColor = document.getElementById('rm-bg-color-hex').value;
      tier.useGradient = document.getElementById('rm-gradient-toggle').checked;
      tier.gradStart = document.getElementById('rm-grad-start-hex').value;
      tier.gradEnd = document.getElementById('rm-grad-end-hex').value;
      tier.rowBg = document.getElementById('rm-solid-bg-hex').value;
      const saved = saveZoneItems();
      renderBoard();
      restoreZoneItems(saved);
      document.getElementById('row-modal-overlay').classList.remove('open');
    }

    function toggleGradientUI() {
      const checked = document.getElementById('rm-gradient-toggle').checked;
      document.getElementById('rm-gradient-ui').style.display = checked ? 'block' : 'none';
      document.getElementById('rm-solid-ui').style.display = checked ? 'none' : 'block';
    }

    // ============================================================
    // GLOBAL SETTINGS MODAL
    // ============================================================
    function openGlobalSettings() {
      document.getElementById('gm-title').value = state.header.title;
      document.getElementById('gm-subtitle').value = state.header.subtitle;
      document.getElementById('gm-left').value = state.header.left;
      document.getElementById('gm-right').value = state.header.right;
      document.getElementById('gm-auto-color').checked = state.autoColor;
      _selectedTheme = state.theme;
      buildThemeGrid();
      document.getElementById('global-modal-overlay').classList.add('open');
    }

    function closeGlobalModal(event) {
      if (event && event.target !== document.getElementById('global-modal-overlay')) return;
      document.getElementById('global-modal-overlay').classList.remove('open');
    }

    function applyGlobalSettings() {
      state.header.title = document.getElementById('gm-title').value || state.header.title;
      state.header.subtitle = document.getElementById('gm-subtitle').value;
      state.header.left = document.getElementById('gm-left').value;
      state.header.right = document.getElementById('gm-right').value;
      state.autoColor = document.getElementById('gm-auto-color').checked;
      document.getElementById('header-title').textContent = state.header.title;
      document.getElementById('header-subtitle').textContent = state.header.subtitle;
      document.getElementById('header-left').textContent = state.header.left;
      document.getElementById('header-right').textContent = state.header.right;
      if (_selectedTheme) applyTheme(_selectedTheme);
      document.getElementById('global-modal-overlay').classList.remove('open');
    }

    // ============================================================
    // COLOR PICKER SYNC HELPERS
    // ============================================================
    function setColorPair(pickerId, hexId, value) {
      const picker = document.getElementById(pickerId);
      const hex = document.getElementById(hexId);
      const val = value.startsWith('#') ? value : '#' + value;
      picker.value = val;
      hex.value = val;
    }

    function syncColorPair(pickerId, hexId) {
      document.getElementById(pickerId).addEventListener('input', function () {
        document.getElementById(hexId).value = this.value;
      });
      document.getElementById(hexId).addEventListener('input', function () {
        const v = this.value;
        if (/^#[0-9A-Fa-f]{6}$/.test(v)) document.getElementById(pickerId).value = v;
      });
    }

    function autoTextColor(hex) {
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      const rP = r / 255, gP = g / 255, bP = b / 255;
      const cmax = Math.max(rP, gP, bP), cmin = Math.min(rP, gP, bP), delta = cmax - cmin;
      let h = 0, s = 0, l = (cmax + cmin) / 2;
      if (delta !== 0) {
        s = delta / (1 - Math.abs(2 * l - 1));
        if (cmax === rP) h = ((gP - bP) / delta) % 6;
        else if (cmax === gP) h = (bP - rP) / delta + 2;
        else h = (rP - gP) / delta + 4;
        h = Math.round(h * 60);
        if (h < 0) h += 360;
      }

      let newL = l;
      if (l > 0.6) newL = Math.max(0, l - 0.45);
      else if (l > 0.4) newL = Math.max(0, l - 0.35);
      else newL = Math.min(1, l + 0.45);

      return hslToHex(h, s, newL);
    }

    function hslToHex(h, s, l) {
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;
      if (0 <= h && h < 60) { r = c; g = x; b = 0; }
      else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
      else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
      else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
      else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
      else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
      r = Math.round((r + m) * 255).toString(16).padStart(2, '0');
      g = Math.round((g + m) * 255).toString(16).padStart(2, '0');
      b = Math.round((b + m) * 255).toString(16).padStart(2, '0');
      return '#' + r + g + b;
    }

    function initColorSyncs() {
      syncColorPair('rm-text-color', 'rm-text-color-hex');
      // bg color picker — also triggers auto text color
      document.getElementById('rm-bg-color').addEventListener('input', function () {
        document.getElementById('rm-bg-color-hex').value = this.value;
        if (state.autoColor) setColorPair('rm-text-color', 'rm-text-color-hex', autoTextColor(this.value));
      });
      document.getElementById('rm-bg-color-hex').addEventListener('input', function () {
        const v = this.value;
        if (/^#[0-9A-Fa-f]{6}$/.test(v)) {
          document.getElementById('rm-bg-color').value = v;
          if (state.autoColor) setColorPair('rm-text-color', 'rm-text-color-hex', autoTextColor(v));
        }
      });
      syncColorPair('rm-grad-start', 'rm-grad-start-hex');
      syncColorPair('rm-grad-end', 'rm-grad-end-hex');
      syncColorPair('rm-solid-bg', 'rm-solid-bg-hex');
    }

    // ============================================================
    // STICKER SYSTEM
    // ============================================================
    document.getElementById('btn-sticker-up').addEventListener('mousedown', function (e) { startStickerDrag(e, 'up'); });
    document.getElementById('btn-sticker-down').addEventListener('mousedown', function (e) { startStickerDrag(e, 'down'); });

    function startStickerDrag(e, type) {
      if (state.isPreview) return;
      e.stopPropagation(); e.preventDefault();

      const el = document.createElement('div');
      el.className = `free-sticker sticker-${type}`;
      el.dataset.stickerType = type;
      el.textContent = type === 'up' ? '▲' : '▼';

      // #app 내부 absolute 레이어에 추가 — 스크롤과 함께 이동, html2canvas 캡처 포함
      const layer = document.getElementById('sticker-layer');
      const appRect = document.getElementById('app').getBoundingClientRect();
      // 초기 위치: 클릭 지점을 #app 기준 절대좌표로 변환
      let x = e.clientX - appRect.left + window.scrollX;
      let y = e.clientY - appRect.top + window.scrollY;
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      el.addEventListener('mousedown', dragSticker);
      el.addEventListener('dblclick', ev => { ev.stopPropagation(); el.remove(); });
      layer.appendChild(el);

      // Start dragging immediately from the button position
      const onMove = ev => {
        const rect = document.getElementById('app').getBoundingClientRect();
        el.style.left = (ev.clientX - rect.left + window.scrollX) + 'px';
        el.style.top = (ev.clientY - rect.top + window.scrollY) + 'px';
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    }

    function dragSticker(e) {
      if (state.isPreview) return;
      e.stopPropagation();
      const el = e.currentTarget;
      // 드래그 시 #app 기준 절대좌표로 업데이트 (스크롤 불변)
      const onMove = ev => {
        const rect = document.getElementById('app').getBoundingClientRect();
        el.style.left = (ev.clientX - rect.left + window.scrollX) + 'px';
        el.style.top = (ev.clientY - rect.top + window.scrollY) + 'px';
      };
      const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    }

    // ============================================================
    // IMAGE UPLOAD
    // ============================================================
    document.getElementById('file-input').addEventListener('change', function (e) {
      handleFiles(e.target.files);
      this.value = '';
    });

    function handleFiles(files) {
      [...files].forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          addToPool(e.target.result, file.name);
        };
        reader.readAsDataURL(file);
      });
    }

    // Page-level drag-and-drop for image upload
    document.addEventListener('dragover', function (e) {
      e.preventDefault();
      if (e.dataTransfer.types.includes('Files')) {
        document.body.classList.add('drag-upload-over');
      }
    });
    document.addEventListener('dragleave', function (e) {
      if (!e.relatedTarget || e.relatedTarget === document.body) {
        document.body.classList.remove('drag-upload-over');
      }
    });
    document.addEventListener('drop', function (e) {
      e.preventDefault();
      document.body.classList.remove('drag-upload-over');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFiles(e.dataTransfer.files);
      }
    });

    // ============================================================
    // PREVIEW MODE
    // ============================================================
    function togglePreview() {
      state.isPreview = !state.isPreview;
      document.body.classList.toggle('preview-mode', state.isPreview);
      const btn = document.getElementById('btn-preview');
      if (state.isPreview) {
        btn.classList.add('ctrl-btn-preview-active');
        btn.innerHTML = '<span>✏️</span> 편집 모드';
      } else {
        btn.classList.remove('ctrl-btn-preview-active');
        btn.innerHTML = '<span>👁</span> 미리보기';
      }
    }

    // ============================================================
    // PNG EXPORT
    // ============================================================
    async function savePNG() {
      const overlay = document.getElementById('saving-overlay');
      overlay.classList.add('show');

      // Temporarily hide editing UI for clean export
      const wasPreview = state.isPreview;
      if (!wasPreview) {
        document.body.classList.add('preview-mode');
      }
      document.getElementById('preview-bar').style.display = 'none';
      overlay.style.display = 'none'; // hide overlay itself from capture

      await new Promise(r => setTimeout(r, 100));

      try {
        const board = document.getElementById('app');
        const canvas = await html2canvas(board, {
          backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0A0A0C',
          scale: 2,
          useCORS: true,
          allowTaint: true,
          logging: false,
          scrollX: 0,
          scrollY: 0,
          ignoreElements: el => el.id === 'asset-pool' || el.id === 'controls-bar' || el.id === 'saving-overlay' || el.id === 'preview-bar',
        });

        const link = document.createElement('a');
        link.download = (state.header.title || 'tierlist') + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        alert('저장 중 오류가 발생했습니다: ' + err.message);
      } finally {
        overlay.style.display = '';
        overlay.classList.remove('show');
        if (!wasPreview) {
          document.body.classList.remove('preview-mode');
        }
        if (state.isPreview) {
          document.getElementById('preview-bar').style.display = '';
        }
      }
    }

    // ============================================================
    // PROJECT SAVE / LOAD
    // ============================================================
    function collectStickerData() {
      const layer = document.getElementById('sticker-layer');
      return [...layer.querySelectorAll('.free-sticker')].map(el => ({
        type: el.dataset.stickerType || (el.classList.contains('sticker-up') ? 'up' : 'down'),
        left: el.style.left,
        top: el.style.top,
      }));
    }

    function collectItemsInTiers() {
      // Returns { tierId: [{id, src, name}, ...], ... }
      const result = {};
      document.querySelectorAll('.tier-items').forEach(zone => {
        result[zone.dataset.tierId] = [...zone.querySelectorAll('.tier-item')].map(el => ({
          id: el.dataset.itemId,
          src: el.querySelector('img').src,
          name: el.querySelector('img').alt || '',
        }));
      });
      return result;
    }

    function collectPoolItems() {
      return [...document.querySelectorAll('#pool-items .tier-item')].map(el => ({
        id: el.dataset.itemId,
        src: el.querySelector('img').src,
        name: el.querySelector('img').alt || '',
      }));
    }

    function saveProject() {
      const labelWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--label-width')) || 68;
      const projectData = {
        version: 1,
        header: {
          title: document.getElementById('header-title').textContent.trim(),
          subtitle: document.getElementById('header-subtitle').textContent.trim(),
          left: document.getElementById('header-left').textContent.trim(),
          right: document.getElementById('header-right').textContent.trim(),
        },
        theme: state.theme,
        autoColor: state.autoColor,
        labelWidth: labelWidth,
        tiers: state.tiers.map(t => ({ ...t })),
        tierItems: collectItemsInTiers(),
        poolItems: collectPoolItems(),
        stickers: collectStickerData(),
        nextItemId: state.nextItemId,
        nextTierId: state.nextTierId,
      };

      const json = JSON.stringify(projectData, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (projectData.header.title || 'tierlist') + '.tierjson';
      a.click();
      URL.revokeObjectURL(url);
    }

    function loadProject(event) {
      const file = event.target.files[0];
      if (!file) return;
      event.target.value = '';
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const data = JSON.parse(e.target.result);
          applyProjectData(data);
        } catch (err) {
          alert('프로젝트 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    function applyProjectData(data) {
      if (!data || data.version !== 1) {
        alert('올바른 프로젝트 파일이 아닙니다.');
        return;
      }

      // Restore header text
      document.getElementById('header-title').textContent = data.header.title || '';
      document.getElementById('header-subtitle').textContent = data.header.subtitle || '';
      document.getElementById('header-left').textContent = data.header.left || '';
      document.getElementById('header-right').textContent = data.header.right || '';
      state.header = { ...data.header };

      // Restore theme & settings
      state.autoColor = !!data.autoColor;
      state.nextItemId = data.nextItemId || 1;
      state.nextTierId = data.nextTierId || 6;
      if (data.labelWidth) {
        document.documentElement.style.setProperty('--label-width', data.labelWidth + 'px');
      }
      if (data.theme) applyTheme(data.theme);

      // Restore tier structure
      state.tiers = (data.tiers || []).map(t => ({ ...t }));

      // Re-render board (no items yet)
      renderBoard();

      // Restore pool
      state.pool = [];
      const poolEl = document.getElementById('pool-items');
      const empty = document.getElementById('pool-empty-msg');
      poolEl.innerHTML = '';
      if (empty) poolEl.appendChild(empty);

      const allItems = {};
      // Add items that were in tiers
      if (data.tierItems) {
        for (const [tierId, items] of Object.entries(data.tierItems)) {
          items.forEach(item => { allItems[item.id] = { tierId, item }; });
        }
      }
      // Add items that were in pool
      if (data.poolItems) {
        data.poolItems.forEach(item => { allItems[item.id] = { tierId: null, item }; });
      }

      // Render all items and place them
      for (const { tierId, item } of Object.values(allItems)) {
        const id = item.id;
        const src = item.src;
        const name = item.name || '';
        const stateItem = { id, src, name };
        state.pool.push(stateItem);
        const el = renderItem(stateItem);
        if (tierId) {
          const zone = document.querySelector(`.tier-items[data-tier-id="${tierId}"]`);
          if (zone) { zone.appendChild(el); continue; }
        }
        if (empty) empty.style.display = 'none';
        poolEl.appendChild(el);
      }
      updatePoolCount();

      // Restore stickers
      const layer = document.getElementById('sticker-layer');
      layer.innerHTML = '';
      if (data.stickers) {
        data.stickers.forEach(s => {
          const el = document.createElement('div');
          el.className = `free-sticker sticker-${s.type}`;
          el.dataset.stickerType = s.type;
          el.textContent = s.type === 'up' ? '▲' : '▼';
          el.style.left = s.left;
          el.style.top = s.top;
          el.addEventListener('mousedown', dragSticker);
          el.addEventListener('dblclick', ev => { ev.stopPropagation(); el.remove(); });
          layer.appendChild(el);
        });
      }
    }

    // ============================================================
    // INIT
    // ============================================================
    function init() {
      applyTheme(state.theme);
      renderBoard();
      initPool();
      initColorSyncs();
      // Header inline edit — sync to state on blur
      const hMap = { 'header-title': 'title', 'header-subtitle': 'subtitle', 'header-left': 'left', 'header-right': 'right' };
      Object.entries(hMap).forEach(([id, key]) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('blur', () => { state.header[key] = el.textContent.trim(); });
        if (id === 'header-title' || id === 'header-subtitle') {
          el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
        }
      });
    }

    init();
  </script>
